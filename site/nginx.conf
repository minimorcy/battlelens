server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/xml;
    gzip_min_length 512;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Capturas e iconos: caché larga
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # CSS/JS: caché corta (sin nombres con hash)
    location ~* \.(css|js)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
