[project]
name = "battlelens"
version = "0.2.1"
description = "Ficha instantánea del Pokémon rival en cualquier emulador mediante OCR (proyecto de fans no oficial)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyqt6>=6.7",
    "mss>=10.0",
    "numpy>=1.26",
    "rapidfuzz>=3.9",
    "pillow>=10.4",
    "winrt-runtime>=3.2",
    "winrt-windows-foundation>=3.2",
    "winrt-windows-media-ocr>=3.2",
    "winrt-windows-globalization>=3.2",
    "winrt-windows-graphics-imaging>=3.2",
    "winrt-windows-storage-streams>=3.2",
    "winrt-windows-foundation-collections>=3.2",
]

[project.scripts]
battlelens = "battlelens.app:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.10",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/battlelens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["windows: requiere APIs de Windows (Win32, OCR nativo, pantalla)"]
