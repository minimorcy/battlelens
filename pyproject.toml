[project]
name = "pokemon-stats-live"
version = "0.1.0"
description = "Detecta el Pokémon rival en cualquier emulador mediante OCR y muestra su ficha en un overlay."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyqt6>=6.7",
    "mss>=10.0",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "rapidfuzz>=3.9",
    "pillow>=10.4",
    "winrt-runtime>=3.2",
    "winrt-windows-foundation>=3.2",
    "winrt-windows-media-ocr>=3.2",
    "winrt-windows-globalization>=3.2",
    "winrt-windows-graphics-imaging>=3.2",
    "winrt-windows-storage-streams>=3.2",
    "winrt-windows-foundation-collections>=3.2",
]

[project.scripts]
pokemon-stats-live = "pokemon_stats_live.app:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pokemon_stats_live"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["windows: requiere APIs de Windows (Win32, OCR nativo, pantalla)"]
